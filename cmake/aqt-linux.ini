[aqt]
baseurl = https://ftp.fau.de/qtproject
[requests]
connection_timeout = 10
response_timeout = 60
max_retries_on_connection_error = 2
max_retries_to_retrieve_hash = 2
# Qt Online Installer repositories publish .sha1 files for these archives.
hash_algorithm = sha1
[mirrors]
trusted_mirrors = https://ftp.fau.de/qtproject
